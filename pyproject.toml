[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/quant_core/tests", "packages/quant_adapters/tests"]
pythonpath = [
  "apps/api/src",
  "packages/quant_core/src",
  "packages/quant_adapters/src"
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
