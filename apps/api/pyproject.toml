[project]
name = "quantresearch-api"
version = "0.1.0"
description = "FastAPI service for QuantResearchCodex."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "boto3>=1.34",
  "fastapi[standard]>=0.115",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "quantresearch-adapters",
  "quantresearch-core",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0"
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-alembic>=0.11",
  "ruff>=0.6"
]

[tool.uv.sources]
quantresearch-core = { path = "../../packages/quant_core", editable = true }
quantresearch-adapters = { path = "../../packages/quant_adapters", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
